[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-dynamodb-session-manager"
version = "0.2.0"
description = "Amazon DynamoDB session manager for Strands Agents — persists sessions, agent state, and messages"
authors = [{name = "Kamal", email = "skamalj@github.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-session-dynamodb>=0.2.0",
]
keywords = [
    "strands", "strands-agents", "session", "session-manager",
    "dynamodb", "aws", "agent-state", "memory", "persistence",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"
Documentation = "https://skamalj.github.io/agentstate-reducer/strands/providers/dynamodb/"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_dynamodb_session_manager"]
