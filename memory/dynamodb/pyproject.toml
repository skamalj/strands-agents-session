[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-dynamodb-store"
version = "0.2.1"
description = "DynamoDB-native-vector MemoryStore for Strands Agents — semantic long-term memory via DynamoDB SearchVectors, no external vector DB"
authors = [{name = "Kamal", email = "skamalj@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.50",
    "boto3>=1.43.78",
]
keywords = [
    "strands", "strands-agents", "memory", "memory-store", "dynamodb",
    "vector-search", "embeddings", "semantic-search", "agent-memory", "aws",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"

[dependency-groups]
dev = ["pytest>=7.0", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_dynamodb_store"]
