[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-store-mongodb"
version = "0.2.0"
description = "MongoDB Vector Search MemoryStore for Strands Agents — semantic memory with Automated Embedding (aka strands-mongodb-store)"
authors = [{name = "Kamal", email = "skamalj@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-mongodb-store>=0.1.0",
]
keywords = ["strands", "strands-agents", "memory", "memory-store", "mongodb", "atlas", "agent-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_store_mongodb"]
