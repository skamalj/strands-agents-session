[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands_session_sql"
version = "0.2.0"
description = "SQL session manager (storage backend) for Strands Agents via SQLAlchemy — one provider for SQLite, PostgreSQL, MySQL, and more"
authors = [{name = "Kamal", email = "skamalj@github.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-agents-session>=0.2.0",
    "strands-agents",
    "sqlalchemy>=2.0",
]
keywords = [
    "strands", "strands-agents", "session", "sql", "sqlalchemy",
    "postgres", "postgresql", "sqlite", "mysql", "agent-state", "persistence",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_session_sql"]
