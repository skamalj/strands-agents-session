[tool.uv.workspace]
members = ["core", "providers/*", "catalog/*", "storage/*"]

# Root pytest config so running multiple package test dirs together (from the
# workspace root) still collects async tests. Without this, the per-package
# asyncio_mode is ignored for multi-dir runs and async tests silently don't run.
[tool.pytest.ini_options]
asyncio_mode = "auto"

# During local development, resolve the base package from the workspace instead
# of PyPI. This is uv-only dev metadata and is NOT written into any published
# wheel — the published providers depend on strands-agents-session from PyPI.
[tool.uv.sources]
strands-agents-session = { workspace = true }
strands-session-dynamodb = { workspace = true }
strands-session-mongodb = { workspace = true }
strands-session-sql = { workspace = true }
strands-dynamodb-session-manager = { workspace = true }
strands-mongodb-session-manager = { workspace = true }
strands-sql-session-manager = { workspace = true }
strands-dynamodb-store = { workspace = true }
strands-storage-dynamodb = { workspace = true }
strands-mongodb-storage = { workspace = true }
strands-storage-mongodb = { workspace = true }
strands-sql-storage = { workspace = true }
strands-postgres-storage = { workspace = true }
strands-storage-postgres = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "strands-agents[openai]",
    "pymongo",
    "sqlalchemy>=2.0",
]
