[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-storage-dynamodb"
version = "0.1.0"
description = "Amazon DynamoDB implementation of the Strands Agents Storage interface — durable bytes-under-keys for sessions, context offload, and memory (aka strands-dynamodb-store)"
authors = [{name = "Kamal", email = "skamalj@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-dynamodb-store>=0.1.0",
]
keywords = [
    "strands", "strands-agents", "storage", "dynamodb", "aws",
    "session", "context-offload", "memory",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_storage_dynamodb"]
