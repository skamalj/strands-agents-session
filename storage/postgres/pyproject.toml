[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-postgres-storage"
version = "0.1.0"
description = "PostgreSQL implementation of the Strands Agents Storage interface — durable bytes-under-keys for sessions, context offload, and memory"
authors = [{name = "Kamal", email = "skamalj@gmail.com"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "strands-sql-storage>=0.1.0",
]
keywords = [
    "strands", "strands-agents", "storage", "postgres", "postgresql",
    "sqlalchemy", "session", "context-offload", "memory",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/skamalj/strands-agents-session"
Repository = "https://github.com/skamalj/strands-agents-session.git"

[dependency-groups]
dev = ["pytest>=7.0", "pytest-asyncio", "psycopg2-binary"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/strands_postgres_storage"]
